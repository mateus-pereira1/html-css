<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <h1>Trabalhando com Listas</h1>
    <h2>Listas Ordenadas</h2>
    <ol type="I">
        <li>Acordar</li>
        <li>Tomar Café</li>
        <li>Escovar os Dentes</li>
        <li>Ir para a Faculdade</li>
        <li>Almoçar</li>
        <li>Ir para o Banheiro</li>
        <li>Voltar para a Casa</li>
        <li>Jantar</li>
        <li>Dormir</li>
    </ol>

    <h2>Listas Não Ordenadas</h2>
    <ul type="square">
        <li>Pão</li>
        <li>Leite</li>
        <li>Tomate</li>
        <li>Feijão</li>
        <li>Manteiga</li>
    </ul>
</body>
</html>
